name: deploy to EC2

on:
  push:
    branch:
      - main
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.gitignore'
      - '.dockerignore'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-ec2-demo:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-ec2-demo:latest
            docker stop ec2-demo || true
            docker rm ec2-demo || true
            docker run -d --name ec2-demo -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/cicd-ec2-demo:latest